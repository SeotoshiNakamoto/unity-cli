name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME}"
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "unity-cli-${GOOS}-${GOARCH}${EXT}" .
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "unity-slot-agent-${GOOS}-${GOARCH}${EXT}" ./cmd/unity-slot-agent

      - uses: actions/upload-artifact@v4
        with:
          name: unity-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            unity-cli-*
            unity-slot-agent-*

  build-slot-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build virtual desktop helper
        run: cargo build --release --manifest-path native/unity-slot-desktop/Cargo.toml

      - name: Rename helper
        shell: pwsh
        run: Copy-Item native/unity-slot-desktop/target/release/unity-slot-desktop.exe unity-slot-desktop-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: unity-slot-desktop-windows-amd64
          path: unity-slot-desktop-windows-amd64.exe

  release:
    needs: [build, build-slot-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: unity-*
